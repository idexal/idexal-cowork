<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>idexal CoWork</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0f14;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      animation: fadeIn 0.6s ease-out;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-icon {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      object-fit: contain;
    }

    .logo-text {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .loading-bar-track {
      width: 200px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .loading-bar-fill {
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #3b82f6, #06b6d4);
      border-radius: 2px;
      animation: loadingSlide 1.5s ease-in-out infinite;
    }

    .loading-text {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.5px;
    }

    .version-text {
      position: absolute;
      bottom: 24px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.2);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes loadingSlide {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(150%); }
      100% { transform: translateX(-100%); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.7; }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="logo-container">
      <img class="logo-icon" src="./idexal-icon.png" alt="idexal CoWork" />
      <span class="logo-text">idexal CoWork</span>
    </div>
    <div class="loading-container">
      <div class="loading-bar-track">
        <div class="loading-bar-fill"></div>
      </div>
      <div class="loading-text" style="animation: pulse 2s ease-in-out infinite;">Starting up…</div>
    </div>
  </div>
  <div class="version-text" id="version">v0.5.52</div>
</body>
</html>
